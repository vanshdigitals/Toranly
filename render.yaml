# Render Blueprint: one free Docker web service (web app + API on the same origin).
# Render → New → Blueprint → pick this repository. Values marked `sync: false` are asked for
# in the Render dashboard and never live in the repository. See
# celebration-event-planner-docs/DEPLOYMENT.md and the checklist in backend/README.md.
services:
  - type: web
    name: toranly
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Neon → Connection details (pooled), scheme postgresql+psycopg://, ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Random 256-bit values generated by Render; nobody has to type or see them.
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # https://<service>.onrender.com, exact, no trailing slash
      - key: APP_ORIGIN
        sync: false
      # AI stays off until a provider has its key AND its account limits.
      - key: XAI_API_KEY
        sync: false
      - key: XAI_ACCOUNT_RPM
        sync: false
      - key: XAI_ACCOUNT_TPM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_ACCOUNT_RPM
        sync: false
      - key: GROQ_ACCOUNT_TPM
        sync: false
      - key: AI_DAILY_SPEND_LIMIT_USD
        value: "2.00"
      - key: WEB_CONCURRENCY
        value: "1"
