name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: toranly
          POSTGRES_PASSWORD: toranly
          POSTGRES_DB: toranly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toranly" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://toranly:toranly@localhost:5432/toranly_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not live"
      - name: web/openapi.json matches the API
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../web/openapi.json
      - name: pip-audit (runtime dependencies)
        run: uv run pip-audit -r requirements.txt --disable-pip
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --frozen --no-emit-project -o /tmp/req.txt -q
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match web/openapi.json
        run: npm run api:types:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: No xAI secrets or URLs in the web source or build
        run: |
          # playwright.config.ts only names test-server env variables (placeholder values).
          ! grep -rIn --exclude-dir=node_modules --exclude=playwright.config.ts -E "api\.x\.ai|XAI_|xai-[A-Za-z0-9]{20,}" .

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: toranly
          POSTGRES_PASSWORD: toranly
          POSTGRES_DB: toranly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toranly" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://toranly:toranly@localhost:5432/toranly
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uv python install 3.14
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://toranly:toranly@localhost:5432/toranly
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # AI answers come from recorded fixtures (APP_ENV=test); nothing reaches xAI or Groq.
      - run: npm run e2e
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t toranly:ci .
